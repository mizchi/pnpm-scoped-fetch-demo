name: Scoped web install
on:
  workflow_dispatch:
    inputs:
      pnpm-version:
        description: Published pnpm build containing scoped fetch support
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: scoped-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            action
            apps/web
            packages/ui
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false
      # This template assumes action.yml and action/ were copied into the project root.
      - name: Fetch the web scope
        id: deps
        uses: ./
        with:
          filters: '{apps/web}...'
          include-workspace-root: 'true'
          save-cache: ${{ github.ref_name == github.event.repository.default_branch }}
      - name: Install the web scope from its store
        env:
          PNPM_BINARY: ${{ steps.deps.outputs.pnpm-binary }}
          PNPM_STORE_DIR: ${{ steps.deps.outputs.store-dir }}
          PNPM_CONFIG_MANAGE_PACKAGE_MANAGER_VERSIONS: 'false'
        run: |
          "$PNPM_BINARY" --store-dir "$PNPM_STORE_DIR" --filter '{apps/web}...' install --frozen-lockfile --offline
