name: Set up cache benchmark
description: Prepare tools, the verified native binary, and the pinned public monorepo.
inputs:
  scope:
    default: workspace
    description: Workload to check out, workspace, or tools-only to skip source checkout.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24.21.0'
        package-manager-cache: false
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 12.16.1
        run_install: false
    - shell: bash
      run: pnpm --dir profiling install --frozen-lockfile --ignore-scripts
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: prototype-pnpm-linux-x64
        path: dist
    - shell: bash
      working-directory: dist
      run: |
        sha256sum --check pnpm.sha256
        chmod +x pnpm
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: inputs.scope == 'workspace'
      with:
        repository: directus/directus
        ref: e0444f46909d530c4af243313a5320571992a30c
        path: benchmark-source
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: inputs.scope != 'workspace' && inputs.scope != 'tools-only'
      with:
        repository: directus/directus
        ref: e0444f46909d530c4af243313a5320571992a30c
        path: benchmark-source
        persist-credentials: false
        sparse-checkout: |
          ${{ inputs.scope }}
          packages
    - shell: bash
      if: inputs.scope != 'workspace' && inputs.scope != 'tools-only'
      env:
        CHECKOUT_SCOPE: ${{ inputs.scope }}
      run: node profiling/ci/checkout.mjs "$CHECKOUT_SCOPE"
