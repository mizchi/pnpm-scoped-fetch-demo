name: Test the scoped fetch action
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      pnpm-version:
        description: Optional published build with scoped fetch support for the transfer demo
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: scoped-action-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test test/*.test.mjs
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
          run_install: false
      - run: pnpm --dir profiling install --frozen-lockfile --ignore-scripts
      - run: node --test profiling/test/*.test.mjs
      - name: Validate workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" .github/workflows/test.yml examples/scoped-install.yml .github/workflows/prototype.yml
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pnpm-version != '' }}
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false
      - name: Measure Action scripts with cold and restored stores
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pnpm-version != '' }}
        run: node demo.mjs --action --candidate pnpm --baseline pnpm --expect-reduction
      - name: Measure app and shared cache groups
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pnpm-version != '' }}
        run: node demo.mjs --groups --candidate pnpm
