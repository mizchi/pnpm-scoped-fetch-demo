name: Test the pnpm prototype
on:
  workflow_dispatch:
    inputs:
      pnpm-ref:
        description: mizchi/pnpm commit or branch to build
        type: string
        default: 2ebada3ddfba7c0066efb29f4d4c07cb84cb9923
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: prototype-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      pnpm-sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the unpublished implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mizchi/pnpm
          ref: ${{ inputs.pnpm-ref || '2ebada3ddfba7c0066efb29f4d4c07cb84cb9923' }}
          path: prototype
          persist-credentials: false
      - name: Record source revision
        id: source
        working-directory: prototype
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore a binary built from this source
        id: binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist
          key: pnpm-prototype-linux-x64-v1-${{ steps.source.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.binary.outputs.cache-hit != 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.binary.outputs.cache-hit != 'true'
        with:
          version: 12.16.1
          run_install: false
      - name: Build the native executable
        if: steps.binary.outputs.cache-hit != 'true'
        working-directory: prototype
        env:
          CARGO_PROFILE_RELEASE_LTO: 'off'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_BUILD_JOBS: '4'
        run: |
          rustup show
          pnpm build:pnpm --locked
          mkdir -p ../dist
          cp target/release/pnpm ../dist/pnpm
          cd ../dist
          sha256sum pnpm > pnpm.sha256
      - name: Verify and record the build
        working-directory: dist
        env:
          PNPM_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          sha256sum --check pnpm.sha256
          chmod +x pnpm
          ./pnpm --version
          printf 'Built mizchi/pnpm at %s.\n\n' "$PNPM_SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prototype-pnpm-linux-x64
          path: dist/
          if-no-files-found: error
          retention-days: 7
  cache-cold:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            action
            .github/actions/smoke
            fixture/apps/web
            fixture/packages/ui
      - uses: ./.github/actions/smoke
        with:
          expected-hit: 'false'
  cache-warm:
    needs: [build, cache-cold]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            action
            .github/actions/smoke
            fixture/apps/web
            fixture/packages/ui
      - uses: ./.github/actions/smoke
        with:
          expected-hit: 'true'
  transfer:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
          run_install: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prototype-pnpm-linux-x64
          path: ${{ runner.temp }}/pnpm-prototype
      - name: Verify prototype
        working-directory: ${{ runner.temp }}/pnpm-prototype
        run: |
          sha256sum --check pnpm.sha256
          chmod +x pnpm
      - name: Measure scoped transfer and cache groups
        env:
          PROTOTYPE: ${{ runner.temp }}/pnpm-prototype/pnpm
        run: |
          node demo.mjs --action --candidate "$PROTOTYPE" --baseline pnpm --expect-reduction
          node demo.mjs --groups --candidate "$PROTOTYPE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prototype-transfer-results
          path: |
            action-results.json
            groups-results.json
            groups-manifest.json
          if-no-files-found: error
          retention-days: 7
