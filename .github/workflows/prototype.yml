name: Benchmark chunked cache on Directus
on:
  workflow_dispatch:
    inputs:
      pnpm-ref:
        description: mizchi/pnpm commit to build
        type: string
        default: 2ebada3ddfba7c0066efb29f4d4c07cb84cb9923
permissions:
  contents: read
  actions: read
concurrency:
  group: cache-groups-benchmark-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  CACHE_NAMESPACE: bench-${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  binary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      pnpm-sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the unpublished implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mizchi/pnpm
          ref: ${{ inputs.pnpm-ref || '2ebada3ddfba7c0066efb29f4d4c07cb84cb9923' }}
          path: prototype
          persist-credentials: false
      - name: Record source revision
        id: source
        working-directory: prototype
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore a binary built from this source
        id: binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist
          key: pnpm-prototype-linux-x64-v1-${{ steps.source.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.binary.outputs.cache-hit != 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.binary.outputs.cache-hit != 'true'
        with:
          version: 12.16.1
          run_install: false
      - name: Build the native executable
        if: steps.binary.outputs.cache-hit != 'true'
        working-directory: prototype
        env:
          CARGO_PROFILE_RELEASE_LTO: 'off'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_BUILD_JOBS: '4'
        run: |
          rustup show
          pnpm build:pnpm --locked
          mkdir -p ../dist
          cp target/release/pnpm ../dist/pnpm
          cd ../dist
          sha256sum pnpm > pnpm.sha256
      - name: Verify and record the build
        working-directory: dist
        env:
          PNPM_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          sha256sum --check pnpm.sha256
          chmod +x pnpm
          ./pnpm --version
          printf 'Built mizchi/pnpm at %s.\n\n' "$PNPM_SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prototype-pnpm-linux-x64
          path: dist/
          if-no-files-found: error
          retention-days: 7
  cold:
    needs: binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sdk-fingerprint: ${{ steps.measure.outputs.sdk-fingerprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cache-benchmark-setup
      - uses: ./.github/actions/cache-groups
        id: measure
        with:
          mode: cold
          namespace: ${{ env.CACHE_NAMESPACE }}
          github-token: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: cache-benchmark-cold-${{ github.run_attempt }}
          path: .measurements/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  producer:
    needs: [binary, cold]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.measure.outputs.matrix }}
      namespace: ${{ env.CACHE_NAMESPACE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cache-benchmark-setup
      - uses: ./.github/actions/cache-groups
        id: measure
        with:
          mode: publish
          namespace: ${{ env.CACHE_NAMESPACE }}
          expected-sdk-fingerprint: ${{ needs.cold.outputs.sdk-fingerprint }}
          github-token: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: cache-benchmark-producer-${{ github.run_attempt }}
          path: .measurements/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  warm:
    needs: producer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.producer.outputs.matrix) }}
    name: warm-${{ matrix.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cache-benchmark-setup
      - uses: ./.github/actions/cache-groups
        with:
          mode: consume
          namespace: ${{ needs.producer.outputs.namespace }}
          github-token: ${{ github.token }}
          entry: ${{ matrix.entry }}
          strategy: ${{ matrix.strategy }}
          target-bytes: ${{ matrix.target }}
          sample: ${{ matrix.sample }}
          plan-digest: ${{ matrix.digest }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: cache-benchmark-${{ matrix.label }}-${{ github.run_attempt }}
          path: .measurements/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  report:
    if: ${{ !cancelled() }}
    needs: [cold, producer, warm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cache-benchmark-*
          path: measurements
      - run: node profiling/ci/report.mjs measurements
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: cache-benchmark-summary-${{ github.run_attempt }}
          path: measurements/summary.*
          if-no-files-found: error
          retention-days: 30
