name: Diagnose native install costs
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  actions: read
concurrency:
  group: native-diagnostics-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
          run_install: false
      - run: pnpm --dir profiling install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prototype-pnpm-linux-x64
          path: dist
          run-id: '41890677535'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cache-benchmark-producer-1
          path: .work/native-seed
          run-id: '41890677535'
          github-token: ${{ github.token }}
      - name: Verify pinned executable and diagnostic tools
        working-directory: dist
        run: |
          sha256sum --check pnpm.sha256
          chmod +x pnpm
          strace --version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: directus/directus
          ref: e0444f46909d530c4af243313a5320571992a30c
          path: benchmark-source
          persist-credentials: false
          sparse-checkout: |
            sdk
            packages
      - run: node profiling/ci/checkout.mjs sdk
      - name: Measure native commands after a real cache restore
        uses: ./.github/actions/cache-groups
        with:
          mode: native-diagnostics
          github-token: ${{ github.token }}
        env:
          NATIVE_SAMPLE: ${{ matrix.sample }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: native-diagnostics-${{ matrix.sample }}
          path: .measurements/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  report:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-diagnostics-*
          path: measurements
      - run: node profiling/ci/native-report.mjs measurements
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-diagnostics-summary
          path: measurements/native-summary.*
          if-no-files-found: error
          retention-days: 30
